# See http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
spring.thymeleaf.cache=false
spring.main.show-banner=false
logging.level.jdbc=OFF
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultsettable=DEBUG
server.port=${PORT:8081}

# Database: локально по умолчанию используется файловая H2, в облаке переопределяется через переменные окружения
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/charitydb;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate schema sync
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console (/h2-console — отключайте в облаке через SPRING_H2_CONSOLE_ENABLED=false)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console